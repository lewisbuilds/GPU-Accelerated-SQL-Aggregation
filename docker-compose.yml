services:
  postgres:
    image: postgres:16.4
    # Note: docker compose (non-swarm) ignores secrets mounting. For local dev we set password directly.
    # In swarm/production you can revert to POSTGRES_PASSWORD_FILE with a real secret.
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocalstrongpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
  fdwengine:
    build:
      context: .
      dockerfile: Dockerfile.fdweng
      args:
        CUDF_VERSION: ${CUDF_VERSION:-25.08}
        INSTALL_GPU: ${INSTALL_GPU:-false}
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      PGHOST: postgres
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD: ${POSTGRES_PASSWORD:-devlocalstrongpassword}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    init: true
    # Enable GPU access for Docker Desktop / compose
    gpus: all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/scripts/verify_gpu.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - backend
volumes:
  pgdata: {}

networks:
  backend:
    driver: bridge
