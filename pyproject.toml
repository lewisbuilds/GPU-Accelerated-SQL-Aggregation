[tool.poetry]
name = "cudf-fdw"
version = "0.1.0"
description = "GPU Aggregation FDW (cuDF + Multicorn)"
authors = ["Your Name <you@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
	{ include = "cudf_fdw", from = "src" },
	{ include = "bench", from = "src" }
]

[tool.poetry.dependencies]
python = "3.11.9"
numpy = "1.26.4"
pyarrow = "16.1.0"
psycopg = {version = "3.1.19", extras=["binary"]}
# Declare cudf-cu12 as optional so base install succeeds on Windows
cudf-cu12 = { version = "24.8.*", optional = true }
# CPU fallback
pandas = "2.2.2"
pynvml = { version = "11.5.0", optional = true }
# NOTE: Multicorn is a PostgreSQL extension, not a portable PyPI dependency.
# Install it via OS / PG extension mechanisms; Python import inside fdw module
# occurs only when PostgreSQL loads the FDW.

[tool.poetry.extras]
gpu = ["cudf-cu12"]
monitor = ["pynvml"]

[tool.poetry.group.dev.dependencies]
pytest = "8.2.2"
ruff = "0.5.0"
black = "24.8.0"
mypy = "1.11.2"
pylint = "3.2.7"
vulture = "2.11"

[tool.poetry.scripts]
run-fdw = "cudf_fdw.engine:main"
golden-bench = "scripts.golden_benchmark:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "C90", # mccabe complexity
]
ignore = [
    "E501",  # line length already managed; allow long comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "\\.venv/"]

[[tool.mypy.overrides]]
module = [
		"cudf.*",
		"pandas.*",
		"pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
allow_untyped_defs = true
allow_untyped_calls = true

[[tool.mypy.overrides]]
module = ["bench.benchmark"]
allow_untyped_defs = true
allow_untyped_calls = true

[tool.pylint.MAIN]
py-version = "3.11"
ignore = [".venv", "build", "dist"]
jobs = 0

[tool.pylint.'MESSAGES CONTROL']
disable = [
	"missing-module-docstring",
	"missing-class-docstring",
	"missing-function-docstring",
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-locals",
	"too-many-branches",
	"too-many-statements",
]

[tool.pylint.BASIC]
good-names = ["df", "pd", "np", "e", "i", "j", "k"]

[tool.pylint.FORMAT]
max-line-length = 100

[tool.vulture]
min_confidence = 80
paths = ["src", "scripts"]
exclude = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
